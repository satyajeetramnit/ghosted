# Production Profile for Render + Neon DB
server.servlet.context-path=/api
# IMPORTANT: schema is managed via Flyway/manual migrations in production.
# 'validate' will refuse to start if entity model and DB schema diverge —
# this is intentional: it prevents silent data-shape changes in prod.
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# JWT — must be supplied via env. Application will fail to start otherwise.
ghosted.app.jwtSecret=${GHOSTED_APP_JWTSECRET}
ghosted.app.jwtExpirationMs=${GHOSTED_APP_JWTEXPIRATIONMS:86400000}

# Pageable defaults
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=200

# Render environment variables mapping (matching User's requested names)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Performance & Stability optimizations
spring.jpa.open-in-view=false
logging.level.com.ghosted=INFO
logging.level.org.hibernate.SQL=WARN

# Neon Free Tier optimization
spring.datasource.hikari.maximum-pool-size=5

# Dynamic port binding
server.port=${PORT:8080}

# Serialize dates as ISO strings not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# Memory and N+1 Optimization
spring.jpa.properties.hibernate.default_batch_fetch_size=20


server.servlet.context-path=/api
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:postgresql://localhost:5432/ghosted_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.ghosted=DEBUG

# Serialize dates as ISO strings not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT secret for local dev only — NEVER reuse this in production. Override via
# environment variable GHOSTED_APP_JWTSECRET (must be >= 64 bytes / 512 bits).
ghosted.app.jwtSecret=${GHOSTED_APP_JWTSECRET:dev-only-insecure-jwt-secret-please-override-in-real-environments-1234567890abcdef}
ghosted.app.jwtExpirationMs=${GHOSTED_APP_JWTEXPIRATIONMS:86400000}

# Pageable defaults
spring.data.web.pageable.default-page-size=50
spring.data.web.pageable.max-page-size=200

